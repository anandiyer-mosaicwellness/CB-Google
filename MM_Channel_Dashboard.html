<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMax Channel / Inventory Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a;
    --text:#e8eaf0; --muted:#8b8fa8; --accent:#4285F4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; }
  header { padding:24px 32px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  header h1 { font-size:1.4rem; font-weight:700; letter-spacing:-.3px; }
  header span { font-size:.8rem; color:var(--muted); }
  .toolbar { padding:16px 32px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .toolbar label { font-size:.8rem; color:var(--muted); margin-right:4px; }
  select { background:#252836; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-size:.85rem; cursor:pointer; }
  select:focus { outline:none; border-color:var(--accent); }
  .metric-tabs { display:flex; gap:4px; }
  .metric-tab { padding:6px 14px; border-radius:6px; font-size:.8rem; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); transition:all .15s; }
  .metric-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .section { padding:0 32px 32px; }
  .section-title { font-size:.95rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:16px; padding-top:24px; }
  .charts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .card-title { font-size:.85rem; font-weight:600; margin-bottom:12px; }
  .card canvas { max-height:180px; }
  .summary-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  thead tr { background:#12151e; }
  th { padding:10px 14px; text-align:right; color:var(--muted); font-weight:500; white-space:nowrap; }
  th:first-child { text-align:left; }
  td { padding:9px 14px; text-align:right; border-top:1px solid var(--border); }
  td:first-child { text-align:left; font-weight:600; }
  tr:hover td { background:#1f2235; }
  .ch-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
  .wow-up { color:#34A853; font-size:.75rem; }
  .wow-dn { color:#EA4335; font-size:.75rem; }
  .wow-na { color:var(--muted); font-size:.75rem; }
  .trend-bar-wrap { display:flex; align-items:center; gap:8px; }
  .trend-bar { height:6px; border-radius:3px; min-width:2px; }
</style>
</head>
<body>

<header>
  <h1>PMax — Channel / Inventory Level Dashboard</h1>
  <span id="latest-label"></span>
</header>

<div class="toolbar">
  <div>
    <label>Account</label>
    <select id="account-filter">
      <option value="all">All Accounts</option>
    </select>
  </div>
  <div>
    <label>Metric</label>
    <div class="metric-tabs">
      <button class="metric-tab active" data-metric="cost">Cost</button>
      <button class="metric-tab" data-metric="conversions">Conversions</button>
      <button class="metric-tab" data-metric="convValue">Conv. Value</button>
      <button class="metric-tab" data-metric="roas">ROAS</button>
      <button class="metric-tab" data-metric="impressions">Impressions</button>
      <button class="metric-tab" data-metric="clicks">Clicks</button>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Latest Week Summary — All Channels</div>
  <div class="summary-card">
    <table id="summary-table">
      <thead>
        <tr>
          <th>Channel</th>
          <th>Cost (₹)</th>
          <th>Impressions</th>
          <th>Clicks</th>
          <th>Conversions</th>
          <th>Conv. Value (₹)</th>
          <th>ROAS</th>
          <th>CPA (₹)</th>
          <th>Cost WoW</th>
          <th>Conv WoW</th>
        </tr>
      </thead>
      <tbody id="summary-body"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-title">Weekly Trend — All Channels</div>
  <div class="charts-grid" id="charts-grid"></div>
</div>

  cost:"Cost (₹)", conversions:"Conversions", convValue:"Conv. Value (₹)",

};

// Populate account dropdown

// ── Summary table ─────────────────────────────────────────────────────────────
function renderSummary() {
  const tbody = document.getElementById("summary-body");
  tbody.innerHTML = "";
  let totalCost=0, totalImpr=0, totalClicks=0, totalConv=0, totalVal=0;
  SUMMARY_DATA.forEach(r => {
    totalCost+=r.cost; totalImpr+=r.impressions; totalClicks+=r.clicks;
    totalConv+=r.conversions; totalVal+=r.convValue;
    const wowClass = v => v==null ? "wow-na" : v>=0 ? "wow-up" : "wow-dn";
    const wowStr   = v => v==null ? "–" : (v>=0?"+":"")+v+"%";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="ch-dot" style="background:${COLORS[r.channel]}"></span>${r.channel}</td>
      <td>₹${r.cost.toLocaleString("en-IN",{maximumFractionDigits:0})}</td>
      <td>${r.impressions.toLocaleString("en-IN")}</td>
      <td>${r.clicks.toLocaleString("en-IN")}</td>
      <td>${r.conversions.toLocaleString("en-IN",{maximumFractionDigits:1})}</td>
      <td>₹${r.convValue.toLocaleString("en-IN",{maximumFractionDigits:0})}</td>
      <td>${r.roas || "–"}</td>
      <td>${r.cpa ? "₹"+r.cpa.toLocaleString("en-IN",{maximumFractionDigits:0}) : "–"}</td>
      <td class="${wowClass(r.costWoW)}">${wowStr(r.costWoW)}</td>
      <td class="${wowClass(r.convWoW)}">${wowStr(r.convWoW)}</td>`;
    tbody.appendChild(tr);
  });
  const totalROAS = totalCost > 0 ? (totalVal/totalCost).toFixed(2) : "–";
  const tfoot = document.createElement("tr");
  tfoot.style.fontWeight="700"; tfoot.style.background="#12151e";
  tfoot.innerHTML = `
    <td>Total</td>
    <td>₹${totalCost.toLocaleString("en-IN",{maximumFractionDigits:0})}</td>
    <td>${totalImpr.toLocaleString("en-IN")}</td>
    <td>${totalClicks.toLocaleString("en-IN")}</td>
    <td>${totalConv.toLocaleString("en-IN",{maximumFractionDigits:1})}</td>
    <td>₹${totalVal.toLocaleString("en-IN",{maximumFractionDigits:0})}</td>
    <td>${totalROAS}</td><td></td><td></td><td></td>`;
  tbody.appendChild(tfoot);
}
renderSummary();

// ── Charts ────────────────────────────────────────────────────────────────────
function getChannelData(ch) {
  if (activeAccount === "all") return WEEKLY_ALL[ch] || null;
  return (WEEKLY_ACC[activeAccount] && WEEKLY_ACC[activeAccount][ch]) || null;
}

function buildCharts() {
  const grid = document.getElementById("charts-grid");
  grid.innerHTML = "";
  CHANNELS.forEach(ch => {
    const data = getChannelData(ch);
    if (!data) return;
    const card = document.createElement("div"); card.className="card";
    card.innerHTML = `<div class="card-title"><span class="ch-dot" style="background:${COLORS[ch]}"></span>${ch}</div><canvas id="chart-${ch.replace(/\s/g,'_')}"></canvas>`;
    grid.appendChild(card);
  });
  CHANNELS.forEach(ch => {
    const data = getChannelData(ch);
    if (!data) return;
    const canvasId = "chart-"+ch.replace(/\s/g,"_");
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    if (chartInstances[ch]) { chartInstances[ch].destroy(); }
    chartInstances[ch] = new Chart(ctx, {
      type:"bar",
      data:{
        labels: data.labels,
        datasets:[{
          label: METRIC_LABELS[activeMetric],
          data: data[activeMetric],
          backgroundColor: COLORS[ch]+"99",
          borderColor: COLORS[ch],
          borderWidth:2,
          borderRadius:4,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:true,
        plugins:{ legend:{display:false}, tooltip:{
          callbacks:{
            label: ctx => {
              const v = ctx.parsed.y;
              if (activeMetric==="cost"||activeMetric==="convValue") return "₹"+v.toLocaleString("en-IN",{maximumFractionDigits:0});
              if (activeMetric==="roas") return v.toFixed(2)+"x";
              return v.toLocaleString("en-IN",{maximumFractionDigits:1});
            }
          }
        }},
        scales:{
          x:{ ticks:{color:"#8b8fa8",font:{size:9},maxRotation:30}, grid:{color:"#1e2133"} },
          y:{ ticks:{color:"#8b8fa8",font:{size:9}}, grid:{color:"#1e2133"} }
        }
      }
    });
  });
}
buildCharts();

// ── Controls ──────────────────────────────────────────────────────────────────
document.querySelectorAll(".metric-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".metric-tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeMetric = btn.dataset.metric;
    buildCharts();
  });
});

sel.addEventListener("change", () => {
  activeAccount = sel.value;
  buildCharts();
});
